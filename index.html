<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="./style.css">
  
  
  <title>Frontend Mentor | Blog preview card</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; margin-top: 20px;}
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>

<div class="card">
  <div class="logo">
    <img src="./assets/images/illustration-article.svg" alt="Learning logo" class="img-logo"/>
  </div>
  <div class="content">
    <p class="category">
    Learning
    </p>
    <p class="date">Published 21 Dec 2023</p> 
    <h2 class="title">HTML & CSS foundations</h2>
    <p class="text">
      These languages are the backbone of every website, 
      defining structure, content, and presentation.
    </p>
  </div>

    <section class="author-details">
      <img src="assets/images/image-avatar.webp" alt="Greg Hooper" class="author"/>
      <p class="author-name">Greg Hooper</p>
    </section>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Chinaecherem</a>.
  </footer>
</div>

</body>
</html>
